  - orTitle: '<span lang="de">Das kleine Einmaleins des klaren Denkens: 22 Denkwerkzeuge f&uuml;r ein besseres Leben</span>'
    zhTitle: 德國一流大學教你數學家的22個思考工具
    author: Christian Hesse
    year: 2009
    url: https://www.google.com/search?q=德國一流大學教你數學家的22個思考工具
    orUrl: https://www.google.com/search?q=Das+kleine+Einmaleins+des+klaren+Denkens%3A+22+Denkwerkzeuge+f&uuml;r+ein+besseres+Leben
    note: |-
      This is actually my favourite math book. It presents 22 "thinking tools"
      that mathematicians commonly use, such as argument by cases, the principle
      of invariance, modularity, etc. In terms of developing thinking, proving, and
      analytical problem-solving skills, this is the most useful book I have ever read,
      and I genuinely think anyone interested in mathematics should read it.
      It is very unfortunate that it does not have an English translation.
      I am sure there are many similar books in English, but still I think this one
      is the best due to how comprehensive and well organized it is.

