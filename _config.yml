title: ZZAlbert
description: |-
  I am a third year undergrad and a math TA at the University of Toronto.
  I write about mathematics and philosophy. This website contains
  information about me, my articles, and more.
author: Albert Hong

# url: "https://zzalbert.com"
# baseurl: ""

# markdown: kramdown
# theme: minima

permalink: pretty

collections:
  privates:
    output: true

  projects:
    output: true
    sort_by: date
    reverse: true

  courses:
    output: true
    sort_by: path

  myposts:
    output: true
    sort_by: date
    reverse: true

  extras:
    output: true
    sort_by: date

defaults:
  - scope:
      path: ""
      type: ""
    values:
      layout: default

  - scope:
      path: ""
      type: "privates"
    values:
      permalink: /:slug/
      layout: plain

  - scope:
      path: ""
      type: "projects"
    values:
      permalink: /profile/projects/:slug/

  - scope:
      path: ""
      type: "courses"
    values:
      permalink: /courses/:slug/
      institution: University of Toronto

  - scope:
      path: ""
      type: "myposts"
    values:
      permalink: /blog/:slug/

  - scope:
      path: ""
      type: "extras"
    values:
      permalink: /extras/:slug/
      showTitle: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
